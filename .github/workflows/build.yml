name: Android APK Release Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK (arm64-v8a only)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Verify source assets
        run: |
          test -f app/src/main/java/com/futo/themestudio/MainActivity.kt
          test -f app/src/main/AndroidManifest.xml

      - name: Build Release APK (64-bit only)
        run: |
          gradle --no-daemon --stacktrace --warning-mode all clean assembleRelease

      - name: Locate and rename APK
        shell: bash
        run: |
          set -euo pipefail
          src="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$src" ]; then
            src="app/build/outputs/apk/release/app-release.apk"
          fi
          test -f "$src" || { echo "لم يتم العثور على APK"; ls -R app/build/outputs/apk/; exit 1; }
          mkdir -p release-out
          cp "$src" release-out/NeonFutoThemeStudio-arm64-v8a-release.apk
          ls -lh release-out/

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonFutoThemeStudio-release-arm64
          path: release-out/NeonFutoThemeStudio-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30
